<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2316"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <pattern id="stripes" width="80" height="520" patternUnits="userSpaceOnUse">
      <rect width="40" height="520" fill="rgba(255, 255, 255, 0.02)"/>
    </pattern>
  </defs>
  <rect width="800" height="520" fill="url(#grass)"/>
  <rect width="800" height="520" fill="url(#stripes)"/>
  
  <!-- Linhas do campo -->
  <g stroke="rgba(255, 255, 255, 0.3)" stroke-width="2.5" fill="none">
    <!-- Linha externa -->
    <rect x="30" y="25" width="740" height="470" rx="4"/>
    <!-- Linha do meio campo -->
    <line x1="400" y1="25" x2="400" y2="495"/>
    <!-- Círculo central -->
    <circle cx="400" cy="260" r="60"/>
    <circle cx="400" cy="260" r="3" fill="rgba(255, 255, 255, 0.6)"/>
    
    <!-- Grande área esquerda -->
    <rect x="30" y="130" width="120" height="260"/>
    <!-- Pequena área esquerda -->
    <rect x="30" y="185" width="45" height="150"/>
    <circle cx="105" cy="260" r="3" fill="rgba(255, 255, 255, 0.6)"/>
    <path d="M 150 215 A 60 60 0 0 1 150 305"/>

    <!-- Grande área direita -->
    <rect x="650" y="130" width="120" height="260"/>
    <!-- Pequena área direita -->
    <rect x="725" y="185" width="45" height="150"/>
    <circle cx="695" cy="260" r="3" fill="rgba(255, 255, 255, 0.6)"/>
    <path d="M 650 215 A 60 60 0 0 0 650 305"/>
  </g>
</svg>