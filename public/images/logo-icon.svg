<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0c1510" stroke="url(#emerald)" stroke-width="3"/>
  <!-- Rede sutil -->
  <g stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.2">
    <line x1="20" y1="20" x2="100" y2="100"/>
    <line x1="40" y1="15" x2="105" y2="80"/>
    <line x1="15" y1="40" x2="80" y2="105"/>
    <line x1="100" y1="20" x2="20" y2="100"/>
    <line x1="80" y1="15" x2="15" y2="80"/>
    <line x1="105" y1="40" x2="40" y2="105"/>
  </g>
  <!-- Bola e rastro -->
  <g transform="translate(60, 60)">
    <circle cx="0" cy="0" r="30" fill="#f8fafc" stroke="#047857" stroke-width="3"/>
    <polygon points="0,-15 11,-6 7,9 -7,9 -11,-6" fill="#0f172a"/>
    <line x1="0" y1="-15" x2="0" y2="-30" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="11" y1="-6" x2="26" y2="-11" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="7" y1="9" x2="19" y2="23" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="-7" y1="9" x2="-19" y2="23" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="-11" y1="-6" x2="-26" y2="-11" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="-8" cy="-8" r="4" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Estrela de campeão no topo -->
  <polygon points="60,10 63,18 72,18 65,23 67,31 60,26 53,31 55,23 48,18 57,18" fill="url(#gold)"/>
</svg>